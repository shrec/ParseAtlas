[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parseatlas"
version = "0.1.0"
description = "Experimental analysis of mathematical expression grammars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sympy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
parseatlas = "parseatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
